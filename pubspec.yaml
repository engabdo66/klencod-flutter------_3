name: gold_shop_flutter
description: تطبيق محل الذهب
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.13.0'
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  
  # الحزمة التي كانت ناقصة وتسبب الخطأ
  flutter_localizations:
    sdk: flutter
  
  cupertino_icons: ^1.0.8

  # إدارة الحالة
  flutter_riverpod: ^3.5.0

  # التوجيه
  go_router: ^18.1.4

  # قاعدة البيانات المحلية (Drift)
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.5.38
  path_provider: ^2.1.5
  path: ^1.9.1

  # الخطوط والأدوات
  google_fonts: ^8.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.4
  build_runner: ^2.4.15

flutter:
  uses-material-design: true